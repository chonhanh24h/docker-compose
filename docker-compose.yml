  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    volumes:
      - ../api-gateway:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync                # Khi file thay đổi, đồng bộ ngay lập tức
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild             # Nếu thay đổi package.json, tự động build lại image
          path: package.json
    command: npm run start:dev
    restart: unless-stopped
    networks:
      - app_services
  core-service:
    build:
      context: ../core-service
      dockerfile: Dockerfile
    container_name: core-service
    ports:
      - "3002:3002"
    volumes:
      - ../core-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo1:27017/23sale
    develop:
      watch:
        - action: sync                # Khi file thay đổi, đồng bộ ngay lập tức
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild             # Nếu thay đổi package.json, tự động build lại image
          path: package.json
    depends_on:
      - mongo1
    command: npm run start:dev
    restart: unless-stopped
    networks:
      - app_services
  post-service:
    build:
      context: ../post-service
      dockerfile: Dockerfile
    container_name: post-service
    ports:
      - "3003:3003"
    volumes:
      - ../post-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo1:27017/23sale
    develop:
      watch:
        - action: sync                # Khi file thay đổi, đồng bộ ngay lập tức
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild             # Nếu thay đổi package.json, tự động build lại image
          path: package.json
    depends_on:
      - mongo1
    command: npm run start:dev
    restart: unless-stopped
    networks:
      - app_services
  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    volumes:
      - ../auth-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo1:27017/23sale
    develop:
      watch:
        - action: sync                # Khi file thay đổi, đồng bộ ngay lập tức
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild             # Nếu thay đổi package.json, tự động build lại image
          path: package.json
    depends_on:
      - mongo1
    command: npm run start:dev
    restart: unless-stopped
    networks:
      - app_services
  web-chonhanh24h:
    build:
      context: ../web-chonhanh24h
      dockerfile: Dockerfile
    container_name: web-chonhanh24h
    ports:
      - "3004:3000"
    volumes:
      - ../web-chonhanh24h:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: package.json
    command: npm run dev
    restart: unless-stopped
    depends_on:
      - api-gateway
    networks:
      - app_services

  9router:
    image: decolua/9router:latest
    container_name: 9router
    ports:
      - "20128:20128"
    volumes:
      - ./data/9router:/app/data
    restart: unless-stopped
    networks:
      - app_services

networks: 
  mongo_rs:
    driver: bridge
    name: mongo_rs
  app_services:
    driver: bridge
    name: app_services
