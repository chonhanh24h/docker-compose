# Lưu ý khi muốn connect giữa các docker container với nhau ta phải sử dụng: (https://github.com/grafana/grafana/issues/46434)
# - 1 là tên của container: {container-name:port}
# - 2 là {http://host.docker.internal:port}
# Lưu ý: các container phải được kết nối vào cùng một mạng (network) thì mới có thể kết nối với nhau thông qua tên của container (https://stackoverflow.com/questions/31163778/connecting-to-a-service-in-a-different-docker-container)

# Không sử dụng được {localhost:port} bởi vì khi ta ở container A thì localhost sẽ chính là bản thân container A đó => nó sẽ ko có exported port của container B => lỗi connect
# Khi ta đứng ở máy local (máy đang chạy docker) thì ta có thể sử dụng {localhost:port} bởi vì các container đã export các port ra bên ngoài

