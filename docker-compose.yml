# Lưu ý khi muốn connect giữa các docker container với nhau ta phải sử dụng: (https://github.com/grafana/grafana/issues/46434)
# - 1 là tên của container: {container-name:port}
# - 2 là {http://host.docker.internal:port}
# Lưu ý: các container phải được kết nối vào cùng một mạng (network) thì mới có thể kết nối với nhau thông qua tên của container (https://stackoverflow.com/questions/31163778/connecting-to-a-service-in-a-different-docker-container)

# Không sử dụng được {localhost:port} bởi vì khi ta ở container A thì localhost sẽ chính là bản thân container A đó => nó sẽ ko có exported port của container B => lỗi connect
# Khi ta đứng ở máy local (máy đang chạy docker) thì ta có thể sử dụng {localhost:port} bởi vì các container đã export các port ra bên ngoài

services:
  mongo1:
    hostname: mongo1
    container_name: mongo1
    image: mongo:8
    volumes:
      - ./data/mongo1/db:/data/db
      - ./data/mongo1/configdb:/data/configdb
    ports:
      - "27017:27017"
    restart: always
    command: [ "mongod", "--bind_ip_all", "--replSet", "mongo_rs" ]
    healthcheck:
      test: echo "db.runCommand('ping').ok" | mongosh --quiet
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - mongo_rs
      - app_services

  api-gateway:
    build:
      context: ../api-gateway
      dockerfile: Dockerfile
    container_name: api-gateway
    ports:
      - "3000:3000"
    volumes:
      - ../api-gateway:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild
          path: package.json
    restart: unless-stopped
    networks:
      - app_services

  core-service:
    build:
      context: ../core-service
      dockerfile: Dockerfile
    container_name: core-service
    ports:
      - "3002:3002"
    volumes:
      - ../core-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo1:27017/core-service
      REDIS_URL: redis://redis:6379
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild
          path: package.json
    depends_on:
      mongo1:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_services

  post-service:
    build:
      context: ../post-service
      dockerfile: Dockerfile
    container_name: post-service
    ports:
      - "3003:3003"
    volumes:
      - ../post-service:/app
      - /app/node_modules
      - ~/.aws:/root/.aws:ro # ro = read only
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo1:27017/post-service
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild
          path: package.json
    depends_on:
      mongo1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_services

  auth-service:
    build:
      context: ../auth-service
      dockerfile: Dockerfile
    container_name: auth-service
    ports:
      - "3001:3001"
    volumes:
      - ../auth-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo1:27017/user-service
      RABBITMQ_URL: amqp://rabbitmq:5672
      REDIS_URL: redis://redis:6379
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild
          path: package.json
    depends_on:
      mongo1:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_services

  notification-service:
    build:
      context: ../notification-service
      dockerfile: Dockerfile
    container_name: notification-service
    ports:
      - "3006:3006"
    volumes:
      - ../notification-service:/app
      - /app/node_modules
      - ~/.aws:/root/.aws:ro
    environment:
      NODE_ENV: development
      RABBITMQ_URL: amqp://rabbitmq:5672
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild
          path: package.json
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_services


  user-service:
    build:
      context: ../user-service
      dockerfile: Dockerfile
    container_name: user-service
    ports:
      - "3005:3005"
    volumes:
      - ../user-service:/app
      - /app/node_modules
    environment:
      NODE_ENV: development
      MONGODB_URI: mongodb://mongo1:27017/user-service
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: rebuild
          path: package.json
    depends_on:
      mongo1:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - app_services

  web-chonhanh24h:
    build:
      context: ../web-chonhanh24h
      dockerfile: Dockerfile
    container_name: web-chonhanh24h
    ports:
      - "3004:3000"
    volumes:
      - ../web-chonhanh24h:/app
      - /app/node_modules
      - /app/.next
    environment:
      NODE_ENV: development
      NEXT_PUBLIC_API_URL: http://localhost:3000
    develop:
      watch:
        - action: sync
          path: ./src
          target: /app/src
          ignore:
            - node_modules
        - action: sync
          path: ./public
          target: /app/public
        - action: rebuild
          path: package.json
    command: npm run dev
    restart: unless-stopped
    depends_on:
      - api-gateway
    networks:
      - app_services

  # chonhanh24h:
  #   build:
  #     context: ../chonhanh24h
  #     dockerfile: Dockerfile
  #   container_name: chonhanh24h
